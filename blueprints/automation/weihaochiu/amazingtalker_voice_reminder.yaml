blueprint:
  name: AmazingTalker 多學員課程語音提醒 · v0.5.0
  description: >-
    版本：v0.5.0。最低 Home Assistant：2026.1.0。
    AmazingTalker Multi-Learner Voice Reminder。從多個 Remote Calendar 行事曆讀取課程，
    提供每日摘要、可自訂課前提醒、取消/改期前重新確認、多播放器播報與個別音量恢復。
    本專案非 AmazingTalker 官方專案。AmazingTalker Calendar URL 是私人讀取網址，請勿公開。
  domain: automation
  author: weihaochiu
  source_url: >-
    https://github.com/weihaochiu/home-assistant-blueprint-amazingtalker-voice-reminder/blob/main/blueprints/automation/weihaochiu/amazingtalker_voice_reminder.yaml
  homeassistant:
    min_version: 2026.1.0
  input:
    learners_section:
      name: 學員行事曆
      icon: mdi:calendar-account
      description: >-
        目前 Blueprint：v0.5.0。每位學員需先建立一個 Remote Calendar。至少新增一筆。
        Calendar URL 是私人讀取網址，不可貼到 GitHub、Issue 或公開論壇。
      input:
        learners:
          name: 學員
          description: >-
            可新增任意數量。播報名稱空白時依序使用行事曆 friendly_name、
            最後使用不含 calendar. 前綴的 entity ID。
          selector:
            object:
              multiple: true
              label_field: spoken_name
              description_field: calendar_entity
              fields:
                calendar_entity:
                  label: AmazingTalker 行事曆
                  required: true
                  selector:
                    entity:
                      filter:
                        - domain: calendar
                spoken_name:
                  label: TTS 播報名稱（選填）
                  selector:
                    text:

    playback_section:
      name: TTS 與播放器
      icon: mdi:account-voice
      input:
        media_players:
          name: 播放器
          description: 至少選擇一個 media_player；每台會獨立播放及處理失敗。
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player
        tts_entity:
          name: TTS 實體
          description: 第一個驗證目標為 Google Translate TTS。
          selector:
            entity:
              filter:
                - domain: tts
        tts_language:
          name: TTS 語言
          default: zh-tw
          selector:
            text:
        announcement_volume:
          name: 播報音量
          default: 0.8
          selector:
            number:
              min: 0
              max: 1
              step: 0.05
              mode: slider
        restore_original_volume:
          name: 恢復各播放器原音量
          description: >-
            播放前分別記錄音量，並在估算語音結束及播放器狀態穩定後逐台恢復。
            播放器未提供 volume_level 時會安全跳過；完成判定為 best effort。
          default: true
          selector:
            boolean:
        attempt_media_resume:
          name: 嘗試恢復原本媒體
          description: >-
            開啟時傳送 announce: true，關閉時傳送 announce: false。此功能依播放器與整合
            支援程度而定，不保證能恢復原本歌曲、播放進度或佇列。Music Assistant 及支援
            Announcement 的播放器成功率較高；HomePod 原生播放、Siri 或 iPhone 直接
            AirPlay 的內容可能無法恢復。
          default: false
          selector:
            boolean:

    scheduled_update_section:
      name: 定期強制更新
      icon: mdi:calendar-sync
      collapsed: true
      description: >-
        這是 Blueprint 額外執行的強制更新，無法降低 Remote Calendar 本身的內建更新頻率。
      input:
        enable_scheduled_update:
          name: 啟用定期強制更新
          default: true
          selector:
            boolean:
        update_frequency:
          name: 更新排程
          description: 只會顯示目前排程模式需要的設定。
          default:
            active_choice: 每天
            每天:
              update_time: "07:00:00"
            每週:
              update_time: "07:00:00"
              update_weekdays:
                - monday
            每月:
              update_time: "07:00:00"
              update_month_days:
                - "1"
          selector:
            choose:
              choices:
                每天:
                  selector:
                    object:
                      fields:
                        update_time:
                          label: 更新時間
                          required: true
                          selector:
                            time:
                每週:
                  selector:
                    object:
                      fields:
                        update_time:
                          label: 更新時間
                          required: true
                          selector:
                            time:
                        update_weekdays:
                          label: 更新星期
                          required: true
                          selector:
                            select:
                              multiple: true
                              custom_value: false
                              mode: dropdown
                              options:
                                - label: 星期一
                                  value: monday
                                - label: 星期二
                                  value: tuesday
                                - label: 星期三
                                  value: wednesday
                                - label: 星期四
                                  value: thursday
                                - label: 星期五
                                  value: friday
                                - label: 星期六
                                  value: saturday
                                - label: 星期日
                                  value: sunday
                每月:
                  selector:
                    object:
                      fields:
                        update_time:
                          label: 更新時間
                          required: true
                          selector:
                            time:
                        update_month_days:
                          label: 更新日期
                          required: true
                          selector:
                            select:
                              multiple: true
                              custom_value: false
                              mode: dropdown
                              options:
                                - {label: "1", value: "1"}
                                - {label: "2", value: "2"}
                                - {label: "3", value: "3"}
                                - {label: "4", value: "4"}
                                - {label: "5", value: "5"}
                                - {label: "6", value: "6"}
                                - {label: "7", value: "7"}
                                - {label: "8", value: "8"}
                                - {label: "9", value: "9"}
                                - {label: "10", value: "10"}
                                - {label: "11", value: "11"}
                                - {label: "12", value: "12"}
                                - {label: "13", value: "13"}
                                - {label: "14", value: "14"}
                                - {label: "15", value: "15"}
                                - {label: "16", value: "16"}
                                - {label: "17", value: "17"}
                                - {label: "18", value: "18"}
                                - {label: "19", value: "19"}
                                - {label: "20", value: "20"}
                                - {label: "21", value: "21"}
                                - {label: "22", value: "22"}
                                - {label: "23", value: "23"}
                                - {label: "24", value: "24"}
                                - {label: "25", value: "25"}
                                - {label: "26", value: "26"}
                                - {label: "27", value: "27"}
                                - {label: "28", value: "28"}
                                - {label: "29", value: "29"}
                                - {label: "30", value: "30"}
                                - {label: "31", value: "31"}

    morning_section:
      name: 當天早晨課程播報
      icon: mdi:weather-sunset-up
      collapsed: true
      input:
        enable_morning_summary:
          name: 啟用早晨摘要
          default: true
          selector:
            boolean:
        morning_summary_time:
          name: 早晨摘要時間
          description: 關閉早晨摘要時忽略。
          default: "07:12:00"
          selector:
            time:
        morning_intro_styles:
          name: 早晨開場語句
          description: >-
            可複選下方完整播報句子。選 1 個時固定播放；選 2 個以上時，每次實際播報
            隨機選擇其中 1 個。純隨機，因此可能連續兩次播放相同句子。
          default:
            - morning_standard
          selector:
            select:
              multiple: true
              custom_value: false
              mode: list
              options:
                - label: 早安提醒，今天有 AmazingTalker 課程。
                  value: morning_standard
                - label: 早安，今天的 AmazingTalker 課程安排如下。
                  value: morning_schedule
                - label: 今天有 AmazingTalker 課程，以下是今天的課程時間。
                  value: morning_today_courses
                - label: 新的一天開始了，今天的 AmazingTalker 課程安排如下。
                  value: morning_new_day
                - label: 早安，以下是今天的 AmazingTalker 課程時間。
                  value: morning_brief

    reminder_section:
      name: 課前提醒與重新同步
      icon: mdi:bell-ring
      collapsed: true
      input:
        enable_pre_class_reminders:
          name: 啟用課前提醒
          default: true
          selector:
            boolean:
        pre_class_message_styles:
          name: 課前提醒語句
          description: >-
            下列句子使用「Grace」與「30分鐘」作為範例。實際播報時會自動代入該
            AmazingTalker Calendar 的「TTS 播報名稱」與實際剩餘分鐘數。可複選。
            選 1 個固定播放；選 2 個以上時，每次實際播報隨機選擇其中 1 個。
            純隨機，因此可能連續兩次播放相同句子。
          default:
            - preclass_standard
          selector:
            select:
              multiple: true
              custom_value: false
              mode: list
              options:
                - label: 提醒您，Grace 的 AmazingTalker 課程將在30分鐘後開始。
                  value: preclass_standard
                - label: 記得準備教材，再過30分鐘，Grace 的 AmazingTalker 課程就要開始了。
                  value: preclass_material
                - label: 課程提醒，Grace 的 AmazingTalker 課程再過30分鐘就要開始了。
                  value: preclass_coming
                - label: 準備上課囉，Grace 的 AmazingTalker 課程將在30分鐘後開始。
                  value: preclass_ready
                - label: 別忘了，30分鐘後有 Grace 的 AmazingTalker 課程。
                  value: preclass_short
        reminder_offsets:
          name: 課前提醒段數
          description: >-
            可新增任意段數，每筆為課程開始前分鐘數，建議 1～1440。執行時會轉整數、
            移除無效/零/負數/重複值並由大到小排序，不會改寫 UI 儲存值。
          default:
            - minutes_before: 30
            - minutes_before: 10
          selector:
            object:
              multiple: true
              label_field: minutes_before
              fields:
                minutes_before:
                  label: 課程開始前分鐘數
                  required: true
                  selector:
                    number:
                      min: 1
                      max: 1440
                      step: 1
                      mode: box
        enable_pre_class_refresh:
          name: 啟用課前重新同步
          default: true
          selector:
            boolean:
        pre_class_refresh_minutes:
          name: 課前重新同步分鐘數
          description: 從現有快取發現即將於此分鐘數後開始的課程時，只更新相關行事曆。
          default: 60
          selector:
            number:
              min: 1
              max: 1440
              step: 1
              mode: box
        verify_before_each_reminder:
          name: 每段提醒前最後確認
          description: >-
            播放前更新相關行事曆並依 UID（或 entity/start/end/summary）確認。更新失敗時
            fail-closed 跳過該行事曆的提醒。
          default: true
          selector:
            boolean:

    diagnostic_logging_section:
      name: 診斷紀錄與除錯
      icon: mdi:file-document-alert
      collapsed: true
      description: >-
        以單行 JSON 寫入 Home Assistant system log，供問題重現與流程比對。
        Blueprint 不會讀取或記錄 Remote Calendar 私人網址。實體檔案輪替與刪除
        不在 Blueprint 權限範圍內；保留天數欄位僅供診斷內容與外部管理參考。
      input:
        enable_diagnostic_logging:
          name: 啟用診斷紀錄
          description: >-
            關閉時不建立一般 diagnostic events；既有 warning/error system log 仍會保留。
            啟用後可用於除錯，且永遠不會記錄私人 Calendar URL 或憑證。
          default: false
          selector:
            boolean:
        diagnostic_log_level:
          name: 診斷紀錄層級
          description: >-
            一般只記錄有實際動作或結果的流程；詳細除錯另記 query、計數與狀態。
            兩種層級都不會為空白 heartbeat 寫入紀錄。
          default: normal
          selector:
            select:
              custom_value: false
              mode: dropdown
              options:
                - label: 一般
                  value: normal
                - label: 詳細除錯
                  value: debug
        diagnostic_log_retention_days:
          name: 診斷紀錄保留天數
          description: >-
            保留政策提示值（1～30 天），會寫入 flow header 供外部管理參考。
            system log 與實體檔案的 rotation/cleanup 由 Home Assistant 安裝環境管理，
            Blueprint 無法套用此數值或自動刪除檔案。
          default: 7
          selector:
            number:
              min: 1
              max: 30
              step: 1
              mode: box
        diagnostic_privacy_mode:
          name: 診斷資料隱私模式
          description: >-
            安全模式不記錄學員名稱或 event summary；詳細模式可記錄這兩項課程內容。
            兩種模式都永遠禁止 Calendar URL、token、cookie、password 與 credentials。
          default: safe
          selector:
            select:
              custom_value: false
              mode: dropdown
              options:
                - label: 安全
                  value: safe
                - label: 詳細
                  value: detailed

# parallel 讓上一分鐘的 TTS 等待不會阻塞下一次 heartbeat。queued 會讓舊執行延後後
# 以過時工作排隊；single 會漏掉 heartbeat。每次執行固定 check_time，避免舊執行重算 now()。
mode: parallel
max: 10
max_exceeded: warning

triggers:
  - trigger: time_pattern
    minutes: "/1"
    id: heartbeat
  - trigger: time
    at: !input morning_summary_time
    id: morning_summary

variables:
  learners_input: !input learners
  media_players_input: !input media_players
  tts_entity_input: !input tts_entity
  tts_language_input: !input tts_language
  announcement_volume_input: !input announcement_volume
  restore_original_volume_input: !input restore_original_volume
  attempt_media_resume_input: !input attempt_media_resume
  enable_scheduled_update_input: !input enable_scheduled_update
  update_frequency_input: !input update_frequency
  enable_morning_summary_input: !input enable_morning_summary
  morning_intro_styles_input: !input morning_intro_styles
  enable_pre_class_reminders_input: !input enable_pre_class_reminders
  pre_class_message_styles_input: !input pre_class_message_styles
  reminder_offsets_input: !input reminder_offsets
  enable_pre_class_refresh_input: !input enable_pre_class_refresh
  pre_class_refresh_minutes_input: !input pre_class_refresh_minutes
  verify_before_each_reminder_input: !input verify_before_each_reminder
  enable_diagnostic_logging_input: !input enable_diagnostic_logging
  diagnostic_log_level_input: !input diagnostic_log_level
  diagnostic_log_retention_days_input: !input diagnostic_log_retention_days
  diagnostic_privacy_mode_input: !input diagnostic_privacy_mode
  # Numeric timestamps survive Home Assistant's cross-action template serialization.
  check_time: "{{ as_timestamp(now()) }}"
  check_minute: "{{ ((check_time | float(0)) // 60 * 60) | int }}"
  diagnostic_trigger: >-
    {{ trigger.id
       if trigger is defined and trigger.id is defined and trigger.id
       else 'manual' }}
  diagnostic_run_id: >-
    {{ as_local(as_datetime(check_time | float(0))).strftime('%Y%m%dT%H%M%S%f')
       ~ '-' ~ diagnostic_trigger }}
  diagnostic_level: >-
    {{ diagnostic_log_level_input
       if diagnostic_log_level_input in ['normal', 'debug'] else 'normal' }}
  diagnostic_privacy: >-
    {{ diagnostic_privacy_mode_input
       if diagnostic_privacy_mode_input in ['safe', 'detailed'] else 'safe' }}
  diagnostic_sensitive_pattern: >-
    (?ix)(?:[a-z][a-z0-9+.-]*://|www\.|api\.amazingtalker\.com/|
    authorization|cookie|password|passwd|credential|token|api[_ -]?key|
    client[_ -]?secret|bearer\s+)
  diagnostic_event_codes:
    - AUTOMATION_START
    - SCHEDULED_REFRESH_START
    - SCHEDULED_REFRESH_RESULT
    - MORNING_QUERY_START
    - MORNING_QUERY_RESULT
    - MORNING_SUMMARY_CREATED
    - MORNING_SUMMARY_SKIPPED
    - HEARTBEAT_ACTIONABLE
    - CALENDAR_QUERY_START
    - CALENDAR_QUERY_RESULT
    - REFRESH_REQUIRED
    - CALENDAR_REFRESH_START
    - CALENDAR_REFRESH_RESULT
    - REMINDER_CANDIDATE
    - REMINDER_VERIFY_START
    - REMINDER_VERIFY_RESULT
    - REMINDER_CONFIRMED
    - REMINDER_SKIPPED
    - TTS_PREPARE
    - PLAYER_VOLUME_SET
    - PLAYER_PLAY_START
    - PLAYER_PLAY_RESULT
    - PLAYER_VOLUME_RESTORE
    - PLAYER_VOLUME_RESTORE_RESULT
    - AUTOMATION_COMPLETE
    - WARNING
    - ERROR
  legacy_schedule_detected: >-
    {{- update_frequency_input is string
        and update_frequency_input | lower | trim in ['daily', 'weekly', 'monthly'] -}}
  morning_phrase_map: >-
    {{- {
      'morning_standard': '早安提醒，今天有 AmazingTalker 課程。',
      'morning_schedule': '早安，今天的 AmazingTalker 課程安排如下。',
      'morning_today_courses': '今天有 AmazingTalker 課程，以下是今天的課程時間。',
      'morning_new_day': '新的一天開始了，今天的 AmazingTalker 課程安排如下。',
      'morning_brief': '早安，以下是今天的 AmazingTalker 課程時間。'
    } -}}
  selected_morning_styles: >-
    {%- set allowed = [
      'morning_standard', 'morning_schedule', 'morning_today_courses',
      'morning_new_day', 'morning_brief'
    ] -%}
    {%- set raw = morning_intro_styles_input -%}
    {%- set values = [raw] if raw is string else
      (raw if raw is iterable and raw is not mapping else []) -%}
    {%- set ns = namespace(items=[]) -%}
    {%- for item in values -%}
      {%- set value = item | string | trim -%}
      {%- if value in allowed and value not in ns.items -%}
        {%- set ns.items = ns.items + [value] -%}
      {%- endif -%}
    {%- endfor -%}
    {{- ns.items if ns.items | count > 0 else ['morning_standard'] -}}
  pre_class_phrase_map: >-
    {{- {
      'preclass_standard': '提醒您，{names} 的 AmazingTalker 課程將在{minutes}分鐘後開始。',
      'preclass_material': '記得準備教材，再過{minutes}分鐘，{names} 的 AmazingTalker 課程就要開始了。',
      'preclass_coming': '課程提醒，{names} 的 AmazingTalker 課程再過{minutes}分鐘就要開始了。',
      'preclass_ready': '準備上課囉，{names} 的 AmazingTalker 課程將在{minutes}分鐘後開始。',
      'preclass_short': '別忘了，{minutes}分鐘後有 {names} 的 AmazingTalker 課程。'
    } -}}
  selected_pre_class_styles: >-
    {%- set allowed = [
      'preclass_standard', 'preclass_material', 'preclass_coming',
      'preclass_ready', 'preclass_short'
    ] -%}
    {%- set raw = pre_class_message_styles_input -%}
    {%- set values = [raw] if raw is string else
      (raw if raw is iterable and raw is not mapping else []) -%}
    {%- set ns = namespace(items=[]) -%}
    {%- for item in values -%}
      {%- set value = item | string | trim -%}
      {%- if value in allowed and value not in ns.items -%}
        {%- set ns.items = ns.items + [value] -%}
      {%- endif -%}
    {%- endfor -%}
    {{- ns.items if ns.items | count > 0 else ['preclass_standard'] -}}
  # Only choose-selector mappings are valid. Unknown or scalar values fail safe.
  schedule_mode: >-
    {%- set modes = {
      '每天': 'daily',
      '每週': 'weekly',
      '每月': 'monthly'
    } -%}
    {%- if update_frequency_input is mapping -%}
      {%- set active_choice = update_frequency_input.get('active_choice', '') | string | trim -%}
      {{- modes.get(active_choice, '') -}}
    {%- else -%}
      {{- '' -}}
    {%- endif -%}
  schedule_config: >-
    {%- if update_frequency_input is mapping -%}
      {%- set active_choice = update_frequency_input.get('active_choice', '') | string | trim -%}
      {%- set selected = update_frequency_input.get(active_choice, {}) -%}
      {{- selected
        if active_choice in ['每天', '每週', '每月'] and selected is mapping
        else {} -}}
    {%- else -%}
      {{- {} -}}
    {%- endif -%}
  schedule_time: >-
    {%- if schedule_config is mapping -%}
      {{- schedule_config.get('update_time', '') | string | trim -}}
    {%- else -%}
      {{- '' -}}
    {%- endif -%}
  schedule_weekdays: >-
    {%- set allowed = [
      'monday', 'tuesday', 'wednesday', 'thursday',
      'friday', 'saturday', 'sunday'
    ] -%}
    {%- set raw = schedule_config.get('update_weekdays', [])
      if schedule_config is mapping else [] -%}
    {%- set values = [raw] if raw is string else
      (raw if raw is iterable and raw is not mapping else []) -%}
    {%- set ns = namespace(items=[]) -%}
    {%- for item in values -%}
      {%- set value = item | string | lower | trim -%}
      {%- if value in allowed and value not in ns.items -%}
        {%- set ns.items = ns.items + [value] -%}
      {%- endif -%}
    {%- endfor -%}
    {{- ns.items -}}
  schedule_month_days: >-
    {%- set raw = schedule_config.get('update_month_days', [])
      if schedule_config is mapping else [] -%}
    {%- set values = [raw] if raw is string or raw is number else
      (raw if raw is iterable and raw is not mapping else []) -%}
    {%- set ns = namespace(items=[]) -%}
    {%- for item in values -%}
      {%- set value = item | int(0) -%}
      {%- if 1 <= value <= 31 and value not in ns.items -%}
        {%- set ns.items = ns.items + [value] -%}
      {%- endif -%}
    {%- endfor -%}
    {{- ns.items | sort -}}
  scheduled_update_due: >-
    {%- set run_time = as_local(as_datetime(check_time | float(0))) -%}
    {%- set configured_time = schedule_time | string | trim -%}
    {%- set weekday_names = [
      'monday', 'tuesday', 'wednesday', 'thursday',
      'friday', 'saturday', 'sunday'
    ] -%}
    {%- set next_month = (run_time.replace(day=28) + timedelta(days=4)).replace(day=1) -%}
    {%- set last_day = (next_month - timedelta(days=1)).day -%}
    {%- set effective = namespace(days=[]) -%}
    {%- for selected_day in schedule_month_days -%}
      {%- set effective_day = [selected_day | int(0), last_day] | min -%}
      {%- if effective_day > 0 and effective_day not in effective.days -%}
        {%- set effective.days = effective.days + [effective_day] -%}
      {%- endif -%}
    {%- endfor -%}
    {{- configured_time | length >= 5
       and run_time.strftime('%H:%M') == configured_time[:5]
       and (schedule_mode == 'daily'
         or (schedule_mode == 'weekly'
           and weekday_names[run_time.weekday()] in schedule_weekdays)
         or (schedule_mode == 'monthly'
           and run_time.day in effective.days)) -}}
  calendar_entities: >-
    {% set ns = namespace(items=[]) %}
    {% for learner in learners_input if learner is mapping %}
      {% set entity = learner.get('calendar_entity', '') | string | trim %}
      {% if entity.startswith('calendar.') and entity not in ns.items %}
        {% set ns.items = ns.items + [entity] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
  normalized_offsets: >-
    {% set ns = namespace(items=[]) %}
    {% for raw in reminder_offsets_input if raw is mapping %}
      {% set value = raw.get('minutes_before', 0) | int(0) %}
      {% if value > 0 and value not in ns.items %}
        {% set ns.items = ns.items + [value] %}
      {% endif %}
    {% endfor %}
    {{ ns.items | sort(reverse=true) }}

conditions:
  - alias: 至少有一個有效的 calendar entity
    condition: template
    value_template: "{{ calendar_entities | count > 0 }}"

actions:
  # YAML anchor provides one schema implementation for every diagnostic event. Each call
  # sets only allowlisted details; no integration config, URL, credential, or whole state
  # object is ever serialized. Normal/debug describes event detail, while system_log uses
  # info so enabled diagnostics remain available in the raw Home Assistant log.
  - &emit_diagnostic
    alias: 發送隱私安全的結構化診斷事件
    if:
      - condition: template
        value_template: >-
          {{ enable_diagnostic_logging_input
             and diagnostic_event is defined
             and diagnostic_event in diagnostic_event_codes
             and diagnostic_emit | default(true)
             and (diagnostic_event_level | default('normal') != 'debug'
               or diagnostic_level == 'debug') }}
    then:
      - action: system_log.write
        data:
          level: info
          logger: blueprints.weihaochiu.amazingtalker_voice_reminder
          message: >-
            {%- set base = {
              'timestamp': now().isoformat(),
              'version': 'v0.5.0',
              'run_id': diagnostic_run_id,
              'trigger': diagnostic_trigger,
              'level': diagnostic_event_level | default('normal'),
              'event': diagnostic_event,
              'result': diagnostic_result | default('unknown')
            } -%}
            {{- dict(base, **(diagnostic_details | default({}))) | to_json -}}
        continue_on_error: true

  # This independent if deliberately continues into the heartbeat reminder flow. A single
  # heartbeat can therefore perform both scheduled refresh and pre-class work.
  - alias: 符合排程時定期強制更新
    if:
      - condition: trigger
        id: heartbeat
      - condition: template
        value_template: "{{ enable_scheduled_update_input }}"
      - alias: 符合時間與每日、每週或月底 fallback 規則
        condition: template
        value_template: "{{ scheduled_update_due }}"
    then:
      - variables:
          diagnostic_flow_started: true
          diagnostic_header_emitted: true
          scheduled_unavailable_calendars: >-
            {% set ns = namespace(items=[]) %}
            {% for entity in calendar_entities
                   if states(entity) in ['unknown', 'unavailable'] %}
              {% set ns.items = ns.items + [entity] %}
            {% endfor %}
            {{ ns.items }}
          diagnostic_event: AUTOMATION_START
          diagnostic_result: started
          diagnostic_event_level: normal
          diagnostic_emit: true
          diagnostic_details: >-
            {{ {
              'timezone': now().tzinfo | string,
              'diagnostic_level': diagnostic_level,
              'privacy_mode': diagnostic_privacy,
              'retention_days_hint': diagnostic_log_retention_days_input | int(7),
              'calendar_count': calendar_entities | count,
              'player_count': media_players_input | count
            } }}
      - *emit_diagnostic
      - variables:
          diagnostic_event: SCHEDULED_REFRESH_START
          diagnostic_result: started
          diagnostic_event_level: normal
          diagnostic_details: >-
            {{ {
              'calendar_count': calendar_entities | count,
              'schedule_mode': schedule_mode,
              'scheduled_time': schedule_time
            } }}
      - *emit_diagnostic
      - if:
          - condition: template
            value_template: "{{ scheduled_unavailable_calendars | count > 0 }}"
        then:
          - action: system_log.write
            data:
              level: warning
              logger: blueprints.weihaochiu.amazingtalker_voice_reminder
              message: >-
                [run_id={{ diagnostic_run_id }}] [WARNING]
                Scheduled refresh includes unavailable calendars:
                {{ scheduled_unavailable_calendars | join(', ') }}.
            continue_on_error: true
      - alias: 本分鐘一次強制更新所有選取的行事曆
        action: homeassistant.update_entity
        target:
          entity_id: "{{ calendar_entities }}"
        continue_on_error: true
      - variables:
          diagnostic_event: SCHEDULED_REFRESH_RESULT
          diagnostic_result: action_dispatched
          diagnostic_event_level: normal
          diagnostic_details: >-
            {{ {
              'calendar_count': calendar_entities | count,
              'available_calendar_count': calendar_entities
                | reject('is_state', 'unavailable')
                | reject('is_state', 'unknown') | list | count,
              'schedule_mode': schedule_mode,
              'scheduled_time': schedule_time
            } }}
      - *emit_diagnostic

  # A valid legacy scalar is actionable migration information. Restrict the warning
  # to local midnight so the minute heartbeat does not flood the system log.
  - alias: 舊 scalar 排程每日遷移警告
    if:
      - condition: trigger
        id: heartbeat
      - condition: template
        value_template: "{{ enable_scheduled_update_input }}"
      - condition: template
        value_template: "{{ legacy_schedule_detected }}"
      - alias: 本地時間每天只在 00:00 提醒一次
        condition: template
        value_template: >-
          {{ as_local(as_datetime(check_time | float(0))).strftime('%H:%M') == '00:00' }}
    then:
      - variables:
          diagnostic_flow_started: true
      - action: system_log.write
        data:
          level: warning
          logger: blueprints.weihaochiu.amazingtalker_voice_reminder
          message: >-
            [run_id={{ diagnostic_run_id }}] [WARNING]
            AmazingTalker Voice Reminder v0.5.0 detected a legacy scheduled-refresh
            value; scheduled refresh is disabled until a structured schedule is saved.
            Morning summaries and pre-class reminders remain active.
        continue_on_error: true

  - choose:
      - alias: 早晨摘要分支
        conditions:
          - condition: trigger
            id: morning_summary
          - condition: template
            value_template: "{{ enable_morning_summary_input }}"
        sequence:
          - variables:
              available_calendars: >-
                {{ calendar_entities
                   | reject('is_state', 'unavailable')
                   | reject('is_state', 'unknown') | list }}
              unavailable_calendars: >-
                {{ calendar_entities | reject('in', available_calendars) | list }}
              diagnostic_flow_started: true
              diagnostic_event: AUTOMATION_START
              diagnostic_result: started
              diagnostic_event_level: normal
              diagnostic_emit: true
              diagnostic_details: >-
                {{ {
                  'timezone': now().tzinfo | string,
                  'diagnostic_level': diagnostic_level,
                  'privacy_mode': diagnostic_privacy,
                  'retention_days_hint': diagnostic_log_retention_days_input | int(7),
                  'calendar_count': calendar_entities | count,
                  'player_count': media_players_input | count
                } }}
          - *emit_diagnostic
          - if:
              - condition: template
                value_template: "{{ unavailable_calendars | count > 0 }}"
            then:
              - action: system_log.write
                data:
                  level: warning
                  logger: blueprints.weihaochiu.amazingtalker_voice_reminder
                  message: >-
                    [run_id={{ diagnostic_run_id }}] [WARNING]
                    Morning query skipped unavailable calendars:
                    {{ unavailable_calendars | join(', ') }}.
                continue_on_error: true
          - variables:
              morning_query_start: >-
                {{ as_local(as_datetime(check_time | float(0)))
                   .replace(hour=0, minute=0, second=0, microsecond=0) }}
              morning_query_end: >-
                {{ as_local(as_datetime(check_time | float(0)))
                   .replace(hour=0, minute=0, second=0, microsecond=0)
                   + timedelta(days=1) }}
              diagnostic_event: MORNING_QUERY_START
              diagnostic_result: started
              diagnostic_event_level: normal
              diagnostic_emit: "{{ available_calendars | count > 0 }}"
              diagnostic_details: >-
                {{ {
                  'available_calendar_count': available_calendars | count,
                  'query_start': morning_query_start | string,
                  'query_end': morning_query_end | string
                } }}
          - *emit_diagnostic
          - variables:
              diagnostic_event: MORNING_QUERY_RESULT
              diagnostic_result: skipped
              diagnostic_event_level: normal
              diagnostic_emit: "{{ available_calendars | count == 0 }}"
              diagnostic_details: >-
                {{ {
                  'available_calendar_count': 0,
                  'event_count': 0,
                  'reason': 'no_available_calendars',
                  'query_start': morning_query_start | string,
                  'query_end': morning_query_end | string
                } }}
          - *emit_diagnostic
          - variables:
              diagnostic_event: MORNING_SUMMARY_SKIPPED
              diagnostic_result: skipped
              diagnostic_event_level: normal
              diagnostic_emit: "{{ available_calendars | count == 0 }}"
              diagnostic_details: "{{ {'reason': 'no_available_calendars'} }}"
          - *emit_diagnostic
          - variables:
              diagnostic_event: AUTOMATION_COMPLETE
              diagnostic_result: completed
              diagnostic_event_level: normal
              diagnostic_emit: "{{ available_calendars | count == 0 }}"
              diagnostic_details: "{{ {'reason': 'no_available_calendars'} }}"
          - *emit_diagnostic
          - alias: 沒有可查詢行事曆時安全結束
            condition: template
            value_template: "{{ available_calendars | count > 0 }}"
          - alias: 從本地午夜查詢到隔日本地午夜（只讀 coordinator 快取）
            action: calendar.get_events
            target:
              entity_id: "{{ available_calendars }}"
            data:
              start_date_time: >-
                {{ as_local(as_datetime(check_time | float(0)))
                   .replace(hour=0, minute=0, second=0, microsecond=0) }}
              end_date_time: >-
                {{ as_local(as_datetime(check_time | float(0)))
                   .replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(days=1) }}
            response_variable: morning_agenda
            continue_on_error: true
          - variables:
              morning_event_count: >-
                {% set ns = namespace(count=0) %}
                {% if morning_agenda is defined %}
                  {% for entity in available_calendars %}
                    {% for event in morning_agenda.get(entity, {}).get('events', []) %}
                      {% set raw_start = event.get('start', '') | string %}
                      {% if 'T' in raw_start or ' ' in raw_start %}
                        {% set ns.count = ns.count + 1 %}
                      {% endif %}
                    {% endfor %}
                  {% endfor %}
                {% endif %}
                {{ ns.count }}
              morning_message: >-
                {# 建立已排序 timed events；日期型 start 是全天事件，直接忽略。 #}
                {% set ns = namespace(events=[]) %}
                {% if morning_agenda is defined %}
                  {% for learner in learners_input if learner is mapping %}
                    {% set entity = learner.get('calendar_entity', '') | string | trim %}
                    {% set requested = learner.get('spoken_name', '') | string | trim %}
                    {% set fallback = state_attr(entity, 'friendly_name') %}
                    {% set name = requested if requested else
                      (fallback if fallback else entity.split('.', 1)[-1]) %}
                    {% for event in morning_agenda.get(entity, {}).get('events', []) %}
                      {% set raw_start = event.get('start', '') | string %}
                      {% if 'T' in raw_start or ' ' in raw_start %}
                        {% set start = as_local(as_datetime(raw_start)) %}
                        {% set ns.events = ns.events + [{
                          'learner': name | string,
                          'start': start,
                          'sort_key': start.strftime('%Y%m%d%H%M') ~ '|' ~ (name | string)
                        }] %}
                      {% endif %}
                    {% endfor %}
                  {% endfor %}
                {% endif %}
                {% set events = ns.events | sort(attribute='sort_key') %}
                {% if events | count > 0 %}
                  {# 純 random，不排除前次結果；一次實際 playback 只抽一次。 #}
                  {% set selected_style = selected_morning_styles | random %}
                  {% set opening = morning_phrase_map.get(
                    selected_style, morning_phrase_map.get('morning_standard')) %}
                  {% set order = namespace(names=[]) %}
                  {% for event in events %}
                    {% if event.learner not in order.names %}
                      {% set order.names = order.names + [event.learner] %}
                    {% endif %}
                  {% endfor %}
                  {% macro spoken_time(dt) -%}
                    {%- set hour = dt.hour -%}
                    {%- set minute = dt.minute -%}
                    {%- if hour == 0 -%}{% set period = '凌晨' %}{% set h = 12 %}
                    {%- elif hour < 6 -%}{% set period = '凌晨' %}{% set h = hour %}
                    {%- elif hour < 12 -%}{% set period = '早上' %}{% set h = hour %}
                    {%- elif hour == 12 -%}{% set period = '中午' %}{% set h = 12 %}
                    {%- elif hour < 18 -%}{% set period = '下午' %}{% set h = hour - 12 %}
                    {%- else -%}{% set period = '晚上' %}{% set h = hour - 12 %}
                    {%- endif -%}
                    {{- period ~ h ~ '點' ~ (minute ~ '分' if minute else '') -}}
                  {%- endmacro %}
                  {{- opening -}}
                  {%- for name in order.names -%}
                    {%- set learner_events = events
                      | selectattr('learner', 'eq', name) | list -%}
                    {{- name }} 的課程時間是
                    {%- for event in learner_events -%}
                      {{- spoken_time(event.start) -}}
                      {{- '、' if not loop.last else '。' -}}
                    {%- endfor %}
                  {%- endfor %}
                {% endif %}
          - variables:
              diagnostic_event: MORNING_QUERY_RESULT
              diagnostic_result: >-
                {{ 'completed' if morning_agenda is defined else 'failed' }}
              diagnostic_event_level: normal
              diagnostic_emit: true
              diagnostic_details: >-
                {{ {
                  'available_calendar_count': available_calendars | count,
                  'event_count': morning_event_count | int(0),
                  'reason': 'service_response_unavailable'
                    if morning_agenda is not defined else none,
                  'query_start': morning_query_start | string,
                  'query_end': morning_query_end | string
                } }}
          - *emit_diagnostic
          - variables:
              diagnostic_event: >-
                {{ 'MORNING_SUMMARY_CREATED'
                   if morning_message | trim | length > 0
                   else 'MORNING_SUMMARY_SKIPPED' }}
              diagnostic_result: >-
                {{ 'created' if morning_message | trim | length > 0 else 'skipped' }}
              diagnostic_event_level: normal
              diagnostic_emit: true
              diagnostic_details: >-
                {{ {
                  'event_count': morning_event_count | int(0),
                  'message_length': morning_message | trim | length,
                  'reason': ('calendar_query_failed'
                    if morning_agenda is not defined else 'no_timed_events')
                    if morning_message | trim | length == 0 else none
                } }}
          - *emit_diagnostic
          - variables:
              diagnostic_event: AUTOMATION_COMPLETE
              diagnostic_result: completed
              diagnostic_event_level: normal
              diagnostic_emit: "{{ morning_message | trim | length == 0 }}"
              diagnostic_details: >-
                {{ {'reason': 'calendar_query_failed'
                    if morning_agenda is not defined else 'no_timed_events'} }}
          - *emit_diagnostic
          - alias: 沒有課程時不改音量也不播放
            condition: template
            value_template: "{{ morning_message | trim | length > 0 }}"
          - alias: 播放早晨摘要
            sequence: &play_announcement
              - variables:
                  announcement_message: "{{ morning_message | trim }}"
                  announcement_kind: "{{ announcement_kind | default('morning_summary') }}"
                  player_snapshots: >-
                    {% set ns = namespace(items=[]) %}
                    {% for player in media_players_input %}
                      {% if states(player) not in ['unknown', 'unavailable'] %}
                        {% set ns.items = ns.items + [{
                          'entity_id': player,
                          'state': states(player),
                          'volume': state_attr(player, 'volume_level')
                            if restore_original_volume_input else none
                        }] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.items }}
                  speech_wait_seconds: >-
                    {{ [[((announcement_message | length) / 3) | round(0, 'ceil') | int + 6, 8] | max, 120] | min }}
              - variables:
                  diagnostic_event: TTS_PREPARE
                  diagnostic_result: prepared
                  diagnostic_event_level: normal
                  diagnostic_emit: true
                  diagnostic_details: >-
                    {{ {
                      'announcement_kind': announcement_kind,
                      'tts_entity': tts_entity_input,
                      'language': tts_language_input,
                      'message_length': announcement_message | length,
                      'player_count': player_snapshots | count,
                      'selected_player_count': media_players_input | count,
                      'announce': attempt_media_resume_input
                    } }}
              - *emit_diagnostic
              - repeat:
                  for_each: >-
                    {{ media_players_input | reject('in',
                       player_snapshots | map(attribute='entity_id') | list) | list }}
                  sequence:
                    - variables:
                        diagnostic_event: PLAYER_PLAY_RESULT
                        diagnostic_result: skipped
                        diagnostic_event_level: normal
                        diagnostic_emit: true
                        diagnostic_details: >-
                          {{ {
                            'player': repeat.item,
                            'reason': 'player_unavailable',
                            'initial_state': states(repeat.item)
                          } }}
                    - *emit_diagnostic
              - alias: 沒有可用播放器時安全結束並在 trace 留下此條件
                condition: template
                value_template: "{{ player_snapshots | count > 0 }}"
              - alias: 分別設定每台可用播放器音量
                repeat:
                  for_each: "{{ player_snapshots }}"
                  sequence:
                    - action: media_player.volume_set
                      target:
                        entity_id: "{{ repeat.item.entity_id }}"
                      data:
                        volume_level: "{{ announcement_volume_input | float(0.8) }}"
                      continue_on_error: true
                    - variables:
                        diagnostic_event: PLAYER_VOLUME_SET
                        diagnostic_result: action_dispatched
                        diagnostic_event_level: normal
                        diagnostic_emit: true
                        diagnostic_details: >-
                          {{ {
                            'player': repeat.item.entity_id,
                            'initial_state': repeat.item.state,
                            'initial_volume': repeat.item.volume,
                            'target_volume': announcement_volume_input | float(0.8),
                            'observed_volume': state_attr(
                              repeat.item.entity_id, 'volume_level')
                          } }}
                    - *emit_diagnostic
              - alias: 分別播放；單台失敗不阻止其他播放器
                repeat:
                  for_each: "{{ player_snapshots }}"
                  sequence:
                    - variables:
                        diagnostic_event: PLAYER_PLAY_START
                        diagnostic_result: started
                        diagnostic_event_level: normal
                        diagnostic_emit: true
                        diagnostic_details: >-
                          {{ {
                            'player': repeat.item.entity_id,
                            'initial_state': repeat.item.state,
                            'initial_volume': repeat.item.volume
                          } }}
                    - *emit_diagnostic
                    - action: media_player.play_media
                      target:
                        entity_id: "{{ repeat.item.entity_id }}"
                      data:
                        media_content_id: >-
                          {{ 'media-source://tts/' ~ tts_entity_input
                             ~ '?message=' ~ (announcement_message | urlencode)
                             ~ '&language=' ~ (tts_language_input | urlencode) }}
                        media_content_type: music
                        announce: "{{ attempt_media_resume_input }}"
                      continue_on_error: true
                    - variables:
                        diagnostic_event: PLAYER_PLAY_RESULT
                        diagnostic_result: action_dispatched
                        diagnostic_event_level: normal
                        diagnostic_emit: true
                        diagnostic_details: >-
                          {{ {
                            'player': repeat.item.entity_id,
                            'observed_state': states(repeat.item.entity_id),
                            'reason': 'service_has_no_success_response'
                          } }}
                    - *emit_diagnostic
              - alias: 依訊息長度保留最低播放時間，避免 action 返回後立即降音量
                delay:
                  seconds: "{{ speech_wait_seconds }}"
              - alias: 再等待狀態離開 buffering（best effort，逾時仍進入恢復）
                wait_template: >-
                  {{ player_snapshots
                     | map(attribute='entity_id')
                     | select('is_state', 'buffering') | list | count == 0 }}
                timeout: "00:00:10"
                continue_on_timeout: true
              - alias: 分別恢復原始音量；沒有 volume_level 時跳過
                repeat:
                  for_each: "{{ player_snapshots if restore_original_volume_input else [] }}"
                  sequence:
                    - variables:
                        diagnostic_event: PLAYER_VOLUME_RESTORE
                        diagnostic_result: >-
                          {{ 'started' if repeat.item.volume is number else 'skipped' }}
                        diagnostic_event_level: normal
                        diagnostic_emit: true
                        diagnostic_details: >-
                          {{ {
                            'player': repeat.item.entity_id,
                            'initial_volume': repeat.item.volume,
                            'before_restore': state_attr(
                              repeat.item.entity_id, 'volume_level'),
                            'reason': none if repeat.item.volume is number
                              else 'no_volume_level'
                          } }}
                    - *emit_diagnostic
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item.volume is number }}"
                      then:
                        - action: media_player.volume_set
                          target:
                            entity_id: "{{ repeat.item.entity_id }}"
                          data:
                            volume_level: "{{ repeat.item.volume }}"
                          continue_on_error: true
                        - variables:
                            diagnostic_event: PLAYER_VOLUME_RESTORE_RESULT
                            diagnostic_result: action_dispatched
                            diagnostic_event_level: normal
                            diagnostic_emit: true
                            diagnostic_details: >-
                              {{ {
                                'player': repeat.item.entity_id,
                                'target_volume': repeat.item.volume,
                                'observed_volume': state_attr(
                                  repeat.item.entity_id, 'volume_level'),
                                'reason': 'service_has_no_success_response'
                              } }}
                        - *emit_diagnostic
                      else:
                        - variables:
                            diagnostic_event: PLAYER_VOLUME_RESTORE_RESULT
                            diagnostic_result: restore_skipped
                            diagnostic_event_level: normal
                            diagnostic_emit: true
                            diagnostic_details: >-
                              {{ {
                                'player': repeat.item.entity_id,
                                'reason': 'no_volume_level'
                              } }}
                        - *emit_diagnostic

          - variables:
              diagnostic_event: AUTOMATION_COMPLETE
              diagnostic_result: completed
              diagnostic_event_level: normal
              diagnostic_emit: true
              diagnostic_details: "{{ {'announcement_kind': 'morning_summary'} }}"
          - *emit_diagnostic

      - alias: 每分鐘 heartbeat 課前流程
        conditions:
          - condition: trigger
            id: heartbeat
          - condition: template
            value_template: >-
              {{ (enable_pre_class_reminders_input and normalized_offsets | count > 0)
                 or enable_pre_class_refresh_input }}
        sequence:
          - variables:
              available_calendars: >-
                {{ calendar_entities
                   | reject('is_state', 'unavailable')
                   | reject('is_state', 'unknown') | list }}
              unavailable_calendars: >-
                {{ calendar_entities | reject('in', available_calendars) | list }}
              query_horizon_minutes: >-
                {% set largest_offset = (normalized_offsets | max)
                  if normalized_offsets | count > 0 else 0 %}
                {{ [([largest_offset,
                       pre_class_refresh_minutes_input | int(60)] | max) + 2, 2] | max }}
          - alias: 沒有可查詢行事曆時安全結束
            condition: template
            value_template: "{{ available_calendars | count > 0 }}"
          - alias: 每分鐘只讀 Remote Calendar coordinator 快取
            action: calendar.get_events
            target:
              entity_id: "{{ available_calendars }}"
            data:
              start_date_time: "{{ as_local(as_datetime(check_minute | float(0))) }}"
              end_date_time: >-
                {{ as_local(as_datetime(check_minute | float(0)))
                   + timedelta(minutes=query_horizon_minutes | int) }}
            response_variable: heartbeat_agenda
            continue_on_error: true
          - variables:
              cached_events: >-
                {% set ns = namespace(items=[]) %}
                {% set run_minute = as_local(as_datetime(check_minute | float(0))) %}
                {% if heartbeat_agenda is defined %}
                  {% for learner in learners_input if learner is mapping %}
                    {% set entity = learner.get('calendar_entity', '') | string | trim %}
                    {% set requested = learner.get('spoken_name', '') | string | trim %}
                    {% set fallback = state_attr(entity, 'friendly_name') %}
                    {% set name = requested if requested else
                      (fallback if fallback else entity.split('.', 1)[-1]) %}
                    {% for event in heartbeat_agenda.get(entity, {}).get('events', []) %}
                      {% set raw_start = event.get('start', '') | string %}
                      {% if 'T' in raw_start or ' ' in raw_start %}
                        {% set start = as_local(as_datetime(raw_start)) %}
                        {% set end = as_local(as_datetime(event.get('end'))) %}
                        {% set remaining = ((start - run_minute).total_seconds() / 60) | round(0, 'floor') | int %}
                        {# 官方 get_events 目前不輸出 UID；保留讀取以便未來相容，現行走 fallback。 #}
                        {% set uid = event.get('uid', '') | string %}
                        {% set identity = entity ~ '|uid|' ~ uid ~ '|' ~ raw_start if uid else
                          entity ~ '|' ~ raw_start ~ '|' ~ (event.get('end', '') | string)
                          ~ '|' ~ (event.get('summary', '') | string) %}
                        {% set ns.items = ns.items + [{
                          'calendar': entity, 'learner': name | string,
                          'start_raw': raw_start,
                          'end_raw': event.get('end', '') | string,
                          'summary': event.get('summary', '') | string,
                          'uid': uid, 'identity': identity,
                          'remaining': remaining
                        }] %}
                      {% endif %}
                    {% endfor %}
                  {% endfor %}
                {% endif %}
                {{ ns.items }}
              refresh_calendars: >-
                {% set target = pre_class_refresh_minutes_input | int(60) %}
                {% set ns = namespace(items=[]) %}
                {% if enable_pre_class_refresh_input %}
                  {% for event in cached_events if event.remaining == target %}
                    {% if event.calendar not in ns.items %}
                      {% set ns.items = ns.items + [event.calendar] %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
                {{ ns.items }}
          - variables:
              refresh_snapshots: >-
                {% set ns = namespace(items=[]) %}
                {% for entity in refresh_calendars %}
                  {% set ns.items = ns.items + [{
                    'calendar': entity,
                    'before': as_timestamp(states[entity].last_reported)
                      if states[entity] is defined else none
                  }] %}
                {% endfor %}
                {{ ns.items }}
              heartbeat_query_failed: "{{ heartbeat_agenda is not defined }}"
              diagnostic_flow_started: >-
                {{ diagnostic_flow_started | default(false)
                   or refresh_calendars | count > 0
                   or heartbeat_agenda is not defined
                   or (diagnostic_level == 'debug' and cached_events | count > 0) }}
              diagnostic_header_emitted: >-
                {{ diagnostic_header_emitted | default(false)
                   or refresh_calendars | count > 0
                   or heartbeat_agenda is not defined
                   or (diagnostic_level == 'debug' and cached_events | count > 0) }}
              diagnostic_event: AUTOMATION_START
              diagnostic_result: started
              diagnostic_event_level: normal
              diagnostic_emit: >-
                {{ not (diagnostic_header_emitted | default(false))
                   and (refresh_calendars | count > 0
                     or heartbeat_agenda is not defined
                     or (diagnostic_level == 'debug' and cached_events | count > 0)) }}
              diagnostic_details: >-
                {{ {
                  'timezone': now().tzinfo | string,
                  'diagnostic_level': diagnostic_level,
                  'privacy_mode': diagnostic_privacy,
                  'retention_days_hint': diagnostic_log_retention_days_input | int(7),
                  'calendar_count': calendar_entities | count,
                  'player_count': media_players_input | count
                } }}
          - *emit_diagnostic
          - variables:
              diagnostic_event: HEARTBEAT_ACTIONABLE
              diagnostic_result: >-
                {{ 'query_failed' if heartbeat_query_failed
                   else ('refresh_required' if refresh_calendars | count > 0
                     else 'cached_events_in_horizon') }}
              diagnostic_event_level: >-
                {{ 'normal' if refresh_calendars | count > 0
                   or heartbeat_query_failed else 'debug' }}
              diagnostic_emit: >-
                {{ refresh_calendars | count > 0
                   or heartbeat_query_failed or cached_events | count > 0 }}
              diagnostic_details: >-
                {{ {
                  'event_count': cached_events | count,
                  'refresh_calendar_count': refresh_calendars | count,
                  'query_horizon_minutes': query_horizon_minutes | int
                } }}
          - *emit_diagnostic
          - variables:
              diagnostic_event: CALENDAR_QUERY_START
              diagnostic_result: started
              diagnostic_event_level: debug
              diagnostic_emit: >-
                {{ cached_events | count > 0 or heartbeat_query_failed }}
              diagnostic_details: >-
                {{ {
                  'available_calendar_count': available_calendars | count,
                  'query_start': as_local(as_datetime(check_minute | float(0))) | string,
                  'query_end': (as_local(as_datetime(check_minute | float(0)))
                    + timedelta(minutes=query_horizon_minutes | int)) | string
                } }}
          - *emit_diagnostic
          - variables:
              diagnostic_event: CALENDAR_QUERY_RESULT
              diagnostic_result: >-
                {{ 'completed' if heartbeat_agenda is defined else 'failed' }}
              diagnostic_event_level: >-
                {{ 'normal' if heartbeat_query_failed else 'debug' }}
              diagnostic_emit: >-
                {{ cached_events | count > 0 or heartbeat_query_failed }}
              diagnostic_details: >-
                {{ {
                  'available_calendar_count': available_calendars | count,
                  'event_count': cached_events | count,
                  'reason': 'service_response_unavailable'
                    if heartbeat_query_failed else none,
                  'query_start': as_local(as_datetime(check_minute | float(0))) | string,
                  'query_end': (as_local(as_datetime(check_minute | float(0)))
                    + timedelta(minutes=query_horizon_minutes | int)) | string
                } }}
          - *emit_diagnostic
          - variables:
              diagnostic_event: REFRESH_REQUIRED
              diagnostic_result: required
              diagnostic_event_level: normal
              diagnostic_emit: "{{ refresh_calendars | count > 0 }}"
              diagnostic_details: >-
                {{ {
                  'calendar_count': refresh_calendars | count,
                  'remaining_minutes': pre_class_refresh_minutes_input | int(60)
                } }}
          - *emit_diagnostic
          - alias: 課前指定時間重新同步，每個目標行事曆一次
            repeat:
              for_each: "{{ refresh_calendars }}"
              sequence:
                - variables:
                    diagnostic_event: CALENDAR_REFRESH_START
                    diagnostic_result: started
                    diagnostic_event_level: normal
                    diagnostic_emit: true
                    diagnostic_details: >-
                      {%- set snapshots = refresh_snapshots
                        | selectattr('calendar', 'eq', repeat.item) | list -%}
                      {{- {
                        'calendar': repeat.item,
                        'remaining_minutes': pre_class_refresh_minutes_input | int(60),
                        'before': snapshots[0].before if snapshots | count > 0 else none
                      } -}}
                - *emit_diagnostic
                - action: homeassistant.update_entity
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true
                - alias: action 已等待 coordinator；再給非同步 entity state write 短暫 settle 時間
                  delay: "00:00:02"
          - variables:
              refresh_successful_calendars: >-
                {% set ns = namespace(items=[]) %}
                {% for snapshot in refresh_snapshots %}
                  {% set entity = snapshot.calendar %}
                  {% if states(entity) not in ['unknown', 'unavailable']
                        and states[entity] is defined
                        and snapshot.before is not none
                        and as_timestamp(states[entity].last_reported)
                          > (snapshot.before | float(0)) %}
                    {% set ns.items = ns.items + [entity] %}
                  {% endif %}
                {% endfor %}
                {{ ns.items | unique | list }}
          - repeat:
              for_each: "{{ refresh_snapshots }}"
              sequence:
                - variables:
                    diagnostic_event: CALENDAR_REFRESH_RESULT
                    diagnostic_result: >-
                      {{ 'completed'
                         if repeat.item.calendar in refresh_successful_calendars
                         else 'failed' }}
                    diagnostic_event_level: normal
                    diagnostic_emit: true
                    diagnostic_details: >-
                      {{ {
                        'calendar': repeat.item.calendar,
                        'before': repeat.item.before,
                        'after': as_timestamp(states[repeat.item.calendar].last_reported)
                          if states[repeat.item.calendar] is defined else none,
                        'remaining_minutes': pre_class_refresh_minutes_input | int(60),
                        'reason': none
                          if repeat.item.calendar in refresh_successful_calendars
                          else ('calendar_unavailable'
                            if states(repeat.item.calendar) in ['unknown', 'unavailable']
                            else 'last_reported_not_advanced')
                      } }}
                - *emit_diagnostic
          - if:
              - condition: template
                value_template: >-
                  {{ refresh_successful_calendars | count
                     < refresh_calendars | count }}
            then:
              - action: system_log.write
                data:
                  level: warning
                  logger: blueprints.weihaochiu.amazingtalker_voice_reminder
                  message: >-
                    [run_id={{ diagnostic_run_id }}] [CALENDAR_REFRESH_RESULT]
                    Pre-class refresh failed because last_reported did not advance or
                    the calendar was unavailable; affected reminders fail closed.
                continue_on_error: true
          - alias: 指定時間有重新同步時，重新查詢最新 coordinator 資料
            if:
              - condition: template
                value_template: "{{ refresh_calendars | count > 0 }}"
            then:
              - action: calendar.get_events
                target:
                  entity_id: "{{ available_calendars }}"
                data:
                  start_date_time: "{{ as_local(as_datetime(check_minute | float(0))) }}"
                  end_date_time: >-
                    {{ as_local(as_datetime(check_minute | float(0)))
                       + timedelta(minutes=query_horizon_minutes | int) }}
                response_variable: refreshed_agenda
                continue_on_error: true
          - variables:
              working_events: >-
                {% if refreshed_agenda is defined %}
                  {% set agenda = refreshed_agenda %}
                {% elif refresh_calendars | count > 0 %}
                  {% set agenda = {} %}
                {% else %}
                  {% set agenda = heartbeat_agenda | default({}) %}
                {% endif %}
                {% set ns = namespace(items=[]) %}
                {% for original in cached_events %}
                  {% set refresh_ok = original.calendar not in refresh_calendars
                    or original.calendar in refresh_successful_calendars %}
                  {% for event in agenda.get(original.calendar, {}).get('events', []) if refresh_ok %}
                    {% set raw_start = event.get('start', '') | string %}
                    {# 若官方未提供 UID，使用完整 fallback identity。 #}
                    {% set uid = event.get('uid', '') | string %}
                    {% set fallback_match = not original.uid and not uid
                      and raw_start == original.start_raw
                      and (event.get('end', '') | string) == original.end_raw
                      and (event.get('summary', '') | string) == original.summary %}
                    {% if (original.uid and uid == original.uid and raw_start == original.start_raw)
                          or fallback_match %}
                      {% set ns.items = ns.items + [original] %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {{ ns.items | unique(attribute='identity') | list }}
              reminder_candidates: >-
                {% set ns = namespace(items=[]) %}
                {% if enable_pre_class_reminders_input %}
                  {% for event in working_events if event.remaining in normalized_offsets %}
                    {% set key = event.identity ~ '|' ~ (event.remaining | string) %}
                    {% if key not in ns.items | map(attribute='reminder_key') | list %}
                      {% set ns.items = ns.items + [dict(event, reminder_key=key)] %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
                {{ ns.items }}
              verify_calendars: >-
                {% set ns = namespace(items=[]) %}
                {% if verify_before_each_reminder_input %}
                  {% for event in reminder_candidates %}
                    {% if event.calendar not in ns.items %}
                      {% set ns.items = ns.items + [event.calendar] %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
                {{ ns.items }}
              verify_snapshots: >-
                {% set ns = namespace(items=[]) %}
                {% for entity in verify_calendars %}
                  {% set ns.items = ns.items + [{
                    'calendar': entity,
                    'before': as_timestamp(states[entity].last_reported)
                      if states[entity] is defined else none
                  }] %}
                {% endfor %}
                {{ ns.items }}
          - variables:
              diagnostic_event: AUTOMATION_START
              diagnostic_result: started
              diagnostic_event_level: normal
              diagnostic_emit: >-
                {{ reminder_candidates | count > 0
                   and not (diagnostic_header_emitted | default(false)) }}
              diagnostic_details: >-
                {{ {
                  'timezone': now().tzinfo | string,
                  'diagnostic_level': diagnostic_level,
                  'privacy_mode': diagnostic_privacy,
                  'retention_days_hint': diagnostic_log_retention_days_input | int(7),
                  'calendar_count': calendar_entities | count,
                  'player_count': media_players_input | count
                } }}
          - *emit_diagnostic
          - variables:
              diagnostic_flow_started: >-
                {{ diagnostic_flow_started | default(false)
                   or reminder_candidates | count > 0 }}
              diagnostic_header_emitted: >-
                {{ diagnostic_header_emitted | default(false)
                   or reminder_candidates | count > 0 }}
              diagnostic_event: HEARTBEAT_ACTIONABLE
              diagnostic_result: reminder_candidates
              diagnostic_event_level: normal
              diagnostic_emit: >-
                {{ reminder_candidates | count > 0 and refresh_calendars | count == 0 }}
              diagnostic_details: >-
                {{ {
                  'event_count': cached_events | count,
                  'candidate_count': reminder_candidates | count,
                  'query_horizon_minutes': query_horizon_minutes | int
                } }}
          - *emit_diagnostic
          - repeat:
              for_each: "{{ reminder_candidates }}"
              sequence:
                - variables:
                    diagnostic_event: REMINDER_CANDIDATE
                    diagnostic_result: candidate
                    diagnostic_event_level: normal
                    diagnostic_emit: true
                    diagnostic_details: >-
                      {%- set base = {
                        'calendar': repeat.item.calendar,
                        'start': repeat.item.start_raw,
                        'end': repeat.item.end_raw,
                        'remaining_minutes': repeat.item.remaining
                      } -%}
                      {{- dict(base,
                        learner='[redacted]'
                          if repeat.item.learner | string
                            | regex_search(diagnostic_sensitive_pattern)
                          else repeat.item.learner,
                        summary='[redacted]'
                          if repeat.item.summary | string
                            | regex_search(diagnostic_sensitive_pattern)
                          else repeat.item.summary)
                        if diagnostic_privacy == 'detailed' else base -}}
                - *emit_diagnostic
          - alias: 每段實際提醒前逐一最後更新；同一行事曆在本 heartbeat 去重
            repeat:
              for_each: "{{ verify_calendars }}"
              sequence:
                - variables:
                    verify_entity: "{{ repeat.item }}"
                    diagnostic_event: REMINDER_VERIFY_START
                    diagnostic_result: started
                    diagnostic_event_level: normal
                    diagnostic_emit: true
                    diagnostic_details: >-
                      {%- set snapshots = verify_snapshots
                        | selectattr('calendar', 'eq', repeat.item) | list -%}
                      {{- {
                        'calendar': repeat.item,
                        'before': snapshots[0].before if snapshots | count > 0 else none
                      } -}}
                - *emit_diagnostic
                - action: homeassistant.update_entity
                  target:
                    entity_id: "{{ verify_entity }}"
                  continue_on_error: true
                - alias: action 已等待 coordinator；短暫 settle 後仍以 last_reported 驗證成功
                  delay: "00:00:02"
          - alias: 最後確認刷新後重新查詢；service完成與 last_reported 共同作為成功證據
            if:
              - condition: template
                value_template: "{{ verify_calendars | count > 0 }}"
            then:
              - variables:
                  verified_calendar_entities: >-
                    {% set ns = namespace(items=[]) %}
                    {% for snapshot in verify_snapshots %}
                      {% set entity = snapshot.calendar %}
                      {% if states(entity) not in ['unknown', 'unavailable']
                            and states[entity] is defined
                            and snapshot.before is not none
                            and as_timestamp(states[entity].last_reported)
                              > (snapshot.before | float(0)) %}
                        {% set ns.items = ns.items + [entity] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.items | unique | list }}
              - if:
                  - condition: template
                    value_template: "{{ verified_calendar_entities | count > 0 }}"
                then:
                  - action: calendar.get_events
                    target:
                      entity_id: "{{ verified_calendar_entities }}"
                    data:
                      start_date_time: "{{ as_local(as_datetime(check_minute | float(0))) }}"
                      end_date_time: >-
                        {{ as_local(as_datetime(check_minute | float(0)))
                           + timedelta(minutes=query_horizon_minutes | int) }}
                    response_variable: verified_agenda
                    continue_on_error: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ verified_calendar_entities | count < verify_calendars | count }}
                then:
                  - alias: 更新失敗採 fail-closed；warning action 本身失敗也不阻塞 Blueprint
                    action: system_log.write
                    data:
                      level: warning
                      logger: blueprints.weihaochiu.amazingtalker_voice_reminder
                      message: >-
                        [run_id={{ diagnostic_run_id }}] [REMINDER_VERIFY_RESULT]
                        Reminder verification refresh failed for one or more calendars;
                        affected reminders were skipped fail-closed.
                    continue_on_error: true
          - variables:
              confirmed_candidates: >-
                {% if not verify_before_each_reminder_input %}
                  {{ reminder_candidates }}
                {% else %}
                  {% set ns = namespace(items=[]) %}
                  {% if verified_agenda is defined %}
                    {% for original in reminder_candidates
                           if original.calendar in verified_calendar_entities | default([]) %}
                      {% for event in verified_agenda.get(original.calendar, {}).get('events', []) %}
                        {% set raw_start = event.get('start', '') | string %}
                        {% set uid = event.get('uid', '') | string %}
                        {% set fallback_match = not original.uid and not uid
                          and raw_start == original.start_raw
                          and (event.get('end', '') | string) == original.end_raw
                          and (event.get('summary', '') | string) == original.summary %}
                        {% if (original.uid and uid == original.uid and raw_start == original.start_raw)
                              or fallback_match %}
                          {% set ns.items = ns.items + [original] %}
                        {% endif %}
                      {% endfor %}
                    {% endfor %}
                  {% endif %}
                  {{ ns.items | unique(attribute='reminder_key') | list }}
                {% endif %}
              reminder_message: >-
                {%- if confirmed_candidates | count > 0 -%}
                  {#- 純 random，不排除前次結果；整次 playback 的所有 offset 共用同一 style。 -#}
                  {%- set selected_style = selected_pre_class_styles | random -%}
                  {%- set phrase_template = pre_class_phrase_map.get(
                    selected_style, pre_class_phrase_map.get('preclass_standard')) -%}
                  {%- set offsets = confirmed_candidates
                    | map(attribute='remaining') | unique | sort(reverse=true) | list -%}
                  {%- for offset in offsets -%}
                    {%- set group = confirmed_candidates
                      | selectattr('remaining', 'eq', offset) | list -%}
                    {%- set names = group | map(attribute='learner') | unique | list -%}
                    {%- set names_text -%}
                      {%- for name in names -%}
                        {{- name -}}
                        {%- if not loop.last -%}
                          {{- ' 和 ' if loop.index == (names | count) - 1 else '、' -}}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endset %}
                    {{- phrase_template
                      | replace('{names}', names_text)
                      | replace('{minutes}', offset | string) -}}
                  {%- endfor %}
                {%- endif -%}
          - repeat:
              for_each: "{{ reminder_candidates }}"
              sequence:
                - variables:
                    candidate_confirmed: >-
                      {{ repeat.item.reminder_key in
                         (confirmed_candidates | map(attribute='reminder_key') | list) }}
                    candidate_reason: >-
                      {%- if not verify_before_each_reminder_input -%}
                        verification_disabled
                      {%- elif repeat.item.calendar not in
                          (verified_calendar_entities | default([])) -%}
                        {{- 'calendar_unavailable'
                           if states(repeat.item.calendar) in ['unknown', 'unavailable']
                           else 'calendar_refresh_failed' -}}
                      {%- else -%}
                        {%- set fresh = verified_agenda.get(
                          repeat.item.calendar, {}).get('events', [])
                          if verified_agenda is defined else [] -%}
                        {%- set same_uid = fresh
                          | selectattr('uid', 'defined')
                          | selectattr('uid', 'eq', repeat.item.uid) | list
                          if repeat.item.uid else [] -%}
                        {{- 'event_identity_changed'
                           if same_uid | count > 0 else 'event_missing_after_refresh' -}}
                      {%- endif -%}
                    diagnostic_event: REMINDER_VERIFY_RESULT
                    diagnostic_result: >-
                      {{ 'confirmed' if candidate_confirmed else 'failed' }}
                    diagnostic_event_level: normal
                    diagnostic_emit: "{{ verify_before_each_reminder_input }}"
                    diagnostic_details: >-
                      {%- set base = {
                        'calendar': repeat.item.calendar,
                        'remaining_minutes': repeat.item.remaining,
                        'verification_result': 'confirmed'
                          if candidate_confirmed else 'failed',
                        'reason': none if candidate_confirmed else candidate_reason
                      } -%}
                      {{- dict(base,
                        learner='[redacted]'
                          if repeat.item.learner | string
                            | regex_search(diagnostic_sensitive_pattern)
                          else repeat.item.learner,
                        summary='[redacted]'
                          if repeat.item.summary | string
                            | regex_search(diagnostic_sensitive_pattern)
                          else repeat.item.summary)
                        if diagnostic_privacy == 'detailed' else base -}}
                - *emit_diagnostic
                - variables:
                    diagnostic_event: >-
                      {{ 'REMINDER_CONFIRMED' if candidate_confirmed
                         else 'REMINDER_SKIPPED' }}
                    diagnostic_result: >-
                      {{ 'confirmed' if candidate_confirmed else 'skipped' }}
                    diagnostic_event_level: normal
                    diagnostic_emit: true
                    diagnostic_details: >-
                      {%- set base = {
                        'calendar': repeat.item.calendar,
                        'remaining_minutes': repeat.item.remaining,
                        'reason': none if candidate_confirmed else candidate_reason
                      } -%}
                      {{- dict(base,
                        learner='[redacted]'
                          if repeat.item.learner | string
                            | regex_search(diagnostic_sensitive_pattern)
                          else repeat.item.learner,
                        summary='[redacted]'
                          if repeat.item.summary | string
                            | regex_search(diagnostic_sensitive_pattern)
                          else repeat.item.summary)
                        if diagnostic_privacy == 'detailed' else base -}}
                - *emit_diagnostic
          - variables:
              diagnostic_event: AUTOMATION_COMPLETE
              diagnostic_result: completed
              diagnostic_event_level: normal
              diagnostic_emit: >-
                {{ diagnostic_flow_started | default(false)
                   and reminder_message | trim | length == 0
                   and not scheduled_update_due }}
              diagnostic_details: "{{ {'reason': 'no_playback_required'} }}"
          - *emit_diagnostic
          - alias: 沒有待提醒課程時不改音量也不播放
            condition: template
            value_template: "{{ reminder_message | trim | length > 0 }}"
          - alias: 播放合併後的課前提醒
            sequence:
              - variables:
                  morning_message: "{{ reminder_message | trim }}"
                  announcement_kind: pre_class_reminder
              - sequence: *play_announcement
          - variables:
              diagnostic_event: AUTOMATION_COMPLETE
              diagnostic_result: completed
              diagnostic_event_level: normal
              diagnostic_emit: "{{ not scheduled_update_due }}"
              diagnostic_details: "{{ {'announcement_kind': 'pre_class_reminder'} }}"
          - *emit_diagnostic

  - variables:
      diagnostic_event: AUTOMATION_COMPLETE
      diagnostic_result: completed
      diagnostic_event_level: normal
      diagnostic_emit: >-
        {{ enable_scheduled_update_input
           and diagnostic_trigger == 'heartbeat'
           and scheduled_update_due }}
      diagnostic_details: "{{ {'completed_at': now().isoformat()} }}"
  - *emit_diagnostic
